<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}はよおきんかい｜AI目覚ましアプリ{% endblock %}</title>
    <meta name="description" content="{% block description %}朝が苦手な人向けのAI目覚ましWebアプリ「はよおきんかい」。{% endblock %}">
    <link rel="canonical" href="{% block canonical %}https://hayo.webtool-labs.com/{% endblock %}">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ddeef9">

    <!-- OGP -->
    <meta property="og:title" content="{{ self.title() }}">
    <meta property="og:description" content="{{ self.description() }}">
    <meta property="og:type" content="article">
    <meta property="og:url" content="{% block og_url %}https://hayo.webtool-labs.com/{% endblock %}">
    <meta property="og:image" content="https://hayo.webtool-labs.com/static/ogp.png">
    <meta property="og:site_name" content="はよおきんかい">
    <meta property="og:locale" content="ja_JP">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ self.title() }}">
    <meta name="twitter:description" content="{{ self.description() }}">
    <meta name="twitter:image" content="https://hayo.webtool-labs.com/static/ogp.png">

    <link rel="icon" href="{{ url_for('static', filename='favicon2.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20019">
    {% block head_extra %}{% endblock %}
</head>
<body class="seo-body">
    <script>try{ if (localStorage.getItem('app_theme') === 'dark') document.body.classList.add('dark-mode'); }catch(e){}</script>
    <header class="seo-header">
        <a href="/" class="seo-logo">はよおきんかい</a>
    </header>

    <main class="seo-page">
        {% block content %}{% endblock %}

        <div class="cta-box">
            <p class="cta-lead">{% block cta_text %}朝が苦手なあなたを、AIが楽しく起こします。{% endblock %}</p>
            <a href="/" class="cta-btn">はよおきんかいを使ってみる</a>
        </div>

        <nav class="related-links">
            <h2>朝が苦手な人向けのお役立ち情報</h2>
            <ul>
                <li><a href="/ai-alarm">AI目覚ましとは？</a></li>
                <li><a href="/mission-alarm">目覚ましミッションとは？</a></li>
                <li><a href="/faq">よくある質問</a></li>
                <li><a href="/blog/cannot-wake-up">朝起きられない原因と対策</a></li>
                <li><a href="/blog/prevent-oversleeping">二度寝を防ぐ方法</a></li>
                <li><a href="/blog/weather-alarm">天気と目覚ましを組み合わせるメリット</a></li>
            </ul>
        </nav>
    </main>

    <footer class="seo-footer">
        <a href="/">← トップページへ戻る</a>
        <span class="seo-copyright">© はよおきんかい</span>
    </footer>
</body>
</html>
